name: C schema QA
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [feature/infra-schema]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_sheet.py data/copy_paste_to_sheets.tsv
